version: '3.8'

services:
  mongodb:
    image: mongo:4.4 # Using a recent stable MongoDB image
    container_name: mongodb
    ports:
      - "27017:27017" # Expose MongoDB port for local access/tools
    environment:
      # Optional: Define root user and password for MongoDB.
      # It's good practice to use environment variables from your .env file for these.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-rootpassword}
      # Define a default database that will be created on startup
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-pewpewlogs}
    volumes:
      - mongodb_data:/data/db # Persist MongoDB data
    networks:
      - web

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pewpewlogs_backend
    networks:
      - web
    ports:
      - "3000:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.pewpewlogs_http.entrypoints=web"
      - "traefik.http.routers.pewpewlogs.service=pewpewlogs"
      - "traefik.http.routers.pewpewlogs_http.rule=Host(`${FQDN_PEWPEWLOGS}`)"
      - "traefik.http.routers.pewpewlogs_http.middlewares=redirect-web-to-websecure@internal"
      - "traefik.http.routers.pewpewlogs.rule=Host(`${FQDN_PEWPEWLOGS}`)"
      - "traefik.http.routers.pewpewlogs.entrypoints=websecure"
      - "traefik.http.routers.pewpewlogs.tls.certresolver=lets-encrypt"
      - "traefik.http.services.pewpewlogs.loadBalancer.server.port=3000"
    env_file:
      - .env
    environment:
      # **IMPORTANT:** Update your backend's database connection string to point to MongoDB
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-root}:${MONGO_ROOT_PASSWORD:-rootpassword}@mongodb:27017/${MONGODB_DATABASE:-pewpewlogs}?authSource=admin
      # You might also want to explicitly pass root credentials if your Node.js app uses them,
      # though it's more common to create a dedicated app user in MongoDB.
      # MONGODB_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      # MONGODB_PASSWORD: ${MONGO_ROOT_PASSWORD:-rootpassword}
    depends_on:
      - mongodb
    volumes:
      - ./backend:/usr/src/app
    command: "npm run dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pewpewlogs_frontend
    networks:
      - web
    ports:
      - "5173:5173" # Vite's default port
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.pewpewlogsfront_http.entrypoints=web"
      - "traefik.http.routers.pewpewlogsfront.service=pewpewlogsfront"
      - "traefik.http.routers.pewpewlogsfront_http.rule=Host(`${FQDN_PEWPEWLOGSFRONT}`)"
      - "traefik.http.routers.pewpewlogsfront_http.middlewares=redirect-web-to-websecure@internal"
      - "traefik.http.routers.pewpewlogsfront.rule=Host(`${FQDN_PEWPEWLOGSFRONT}`)"
      - "traefik.http.routers.pewpewlogsfront.entrypoints=websecure"
      - "traefik.http.routers.pewpewlogsfront.tls.certresolver=lets-encrypt"
      - "traefik.http.services.pewpewlogsfront.loadBalancer.server.port=5173"
    env_file:
      - .env
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    command: "npm run dev -- --host 0.0.0.0"

networks:
  web:
    external: true

volumes:
  mongodb_data: # Define the new volume for MongoDB data
